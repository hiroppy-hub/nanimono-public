/* スタート画面（ヒーロー） */
#start {
  text-align: center;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0 0 42%;
  aspect-ratio: 16 / 9;
  width: min(1500px, 92vw);
  max-height: 95vh;
  margin-top: 0;
  margin-bottom: 0;
  margin-left: calc(50% - min(750px, 46vw) - 20px);
  margin-right: calc(50% - min(750px, 46vw) - 20px);
  background-image: url('挿絵/_top_hero.webp');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #faf7fb;
  border-radius: 16px;
  overflow: hidden;
}
#start::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(245,240,250,0.0) 0%, rgba(245,240,250,0.15) 100%);
  pointer-events: none;
}
#start > * { position: relative; z-index: 1; }
#start h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 56px;
  letter-spacing: 16px;
  font-weight: 500;
  margin-bottom: 14px;
  color: #4a3a6a;
  text-shadow: 0 2px 12px rgba(255,255,255,0.6);
}
#start p {
  color: #6a5a8a;
  margin-bottom: 48px;
  font-size: 13px;
  letter-spacing: 4px;
  font-family: 'Noto Serif JP', serif;
}
#start button {
  position: relative;
  background: transparent;
  border: none;
  padding: 8px 44px;
  transform: translateX(2%);
  font-size: 24px;
  color: #5a4880;
  letter-spacing: 0.35em;
  font-family: 'Zen Old Mincho', serif;
  font-weight: 300;
  line-height: 2.0;
  text-indent: 0.35em;
  font-feature-settings: "palt";
  cursor: pointer;
  transition: all 0.25s;
  text-shadow: 0 1px 8px rgba(255,255,255,0.6);
}
#start button::before {
  content: '';
  position: absolute;
  inset: -80%;
  background: radial-gradient(ellipse at center,
    rgba(255,250,235,0.9) 0%,
    rgba(247,231,206,0.8) 10%,
    rgba(235,215,210,0.55) 25%,
    rgba(210,185,220,0.4) 45%,
    rgba(168,140,200,0.2) 65%,
    rgba(124,92,191,0) 80%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.5s ease, transform 0.5s ease;
  transform: scale(0.6);
  pointer-events: none;
  z-index: -1;
  filter: blur(4px);
  mix-blend-mode: screen;
}
#start button::after {
  content: '';
  position: absolute;
  inset: -20%;
  background: radial-gradient(circle at center, rgba(255,250,240,0.85) 0%, rgba(247,231,206,0.5) 30%, rgba(247,231,206,0) 60%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  transform: scale(0.5);
  pointer-events: none;
  z-index: -1;
  filter: blur(2px);
  mix-blend-mode: screen;
}
#start button:hover::before,
#start button:active::before,
#start button:focus::before {
  opacity: 1;
  transform: scale(1.2);
  animation: coronaPulse 3s ease-in-out infinite;
}
#start button:hover::after,
#start button:active::after,
#start button:focus::after {
  opacity: 1;
  transform: scale(1);
}
@keyframes buttonGlow {
  0%, 100% {
    box-shadow:
      0 0 16px rgba(255, 240, 200, 0.6),
      0 0 32px rgba(255, 220, 170, 0.35),
      0 0 56px rgba(216, 184, 130, 0.2);
  }
  50% {
    box-shadow:
      0 0 24px rgba(255, 245, 215, 0.9),
      0 0 48px rgba(255, 225, 175, 0.6),
      0 0 80px rgba(216, 184, 130, 0.45);
  }
}
@keyframes coronaPulse {
  0%, 100% { transform: scale(1.2); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.85; }
}
#start button:hover,
#start button:active,
#start button:focus {
  color: #7c5cbf;
  text-shadow:
    0 0 6px rgba(255,255,255,0.9),
    0 0 16px rgba(255,255,255,0.6),
    0 0 32px rgba(168,124,207,0.4);

/* イントロモーダル（ニックネーム＋生年月日入力） */
#introModal {

  animation: introFade 0.4s ease;
  padding: 16px;
}
/* モバイルはbackdrop-filterのタップ死バグ回避でblur切る（背景は不透明寄りに） */
@media (max-width: 700px) {
  #introModal {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: rgba(20, 14, 32, 0.88);
  }
}
@keyframes introFade { from { opacity: 0; } to { opacity: 1; } }
.intro-card {

.intro-card h2 {

}
.intro-card .intro-sub {

  margin: 0 0 26px;
}
.intro-field { margin-bottom: 18px; text-align: left; }
.intro-field label {
  display: block; font-size: 12px; letter-spacing: 0.18em;
  color: #6a5a8a; margin-bottom: 8px;
}
.intro-field .intro-optional { color: #b8985c; font-size: 10px; margin-left: 6px; }
.intro-field input[type=text] {
  width: 100%; padding: 10px 12px;
  border: 1px solid rgba(184, 152, 92, 0.4);
  border-radius: 8px;
  background: rgba(255, 252, 245, 0.7);
  font-size: 15px;
  font-family: inherit;
  color: #4a3a6a;

}
.intro-field input[type=text]:focus {
  outline: none;
  border-color: #b8985c;
  background: #fff;
}
.intro-date { display: flex; gap: 8px; }
.intro-gender { display: flex; gap: 8px; }
.intro-gender .gender-opt {
  flex: 1;
  position: relative;
  cursor: pointer;
}
.intro-gender .gender-opt input { position: absolute; opacity: 0; pointer-events: none; }
.intro-gender .gender-opt span {
  display: block;
  padding: 10px 8px;
  text-align: center;
  border: 1px solid rgba(184, 152, 92, 0.4);
  border-radius: 8px;
  background: rgba(255, 252, 245, 0.7);
  font-size: 13px;
  color: #6a5a8a;
  letter-spacing: 0.15em;

}
.intro-gender .gender-opt input:checked + span {
  background: linear-gradient(180deg, #f3e2a8 0%, #d9b96f 100%);
  border-color: #b8985c;
  color: #4a3a2f;
  font-weight: 500;
  box-shadow: 0 0 8px rgba(216, 184, 130, 0.4) inset;
}
/* ドラム式ホイールピッカー（LINE内蔵ブラウザでも動く自前実装） */
.wheel-date {
  position: relative;
  display: flex;
  gap: 6px;
  background: rgba(255, 252, 245, 0.92);
  border: 1px solid rgba(184, 152, 92, 0.4);
  border-radius: 10px;
  padding: 4px 8px;
  overflow: hidden;
}
.wheel-col { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
.wheel-col:first-child { flex: 1.4; }
.wheel-unit {
  position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: #b8985c; pointer-events: none; z-index: 4;
}
.wheel {
  --item-h: 34px;
  height: calc(var(--item-h) * 3);
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
  width: 100%;
  -webkit-overflow-scrolling: touch;
  position: relative;
  z-index: 2;
}
.wheel::-webkit-scrollbar { display: none; }
.wheel-item {
  height: var(--item-h);
  line-height: var(--item-h);
  text-align: center;
  scroll-snap-align: center;
  font-size: 17px;
  font-family: inherit;
  color: #b3a488;
  opacity: 0.55;
}
.wheel-item.center { color: #4a3a2f; font-weight: 600; opacity: 1; }
.wheel-pad { height: var(--item-h); scroll-snap-align: none; }
/* 中央セレクションバンド */
.wheel-mask {
  position: absolute; left: 0; right: 0; top: 50%;
  height: 34px; transform: translateY(-50%);
  border-top: 1px solid rgba(184, 152, 92, 0.55);
  border-bottom: 1px solid rgba(184, 152, 92, 0.55);
  background: rgba(216, 184, 130, 0.08);
  pointer-events: none; z-index: 3;
}
/* 上下フェード */
.wheel-date::before, .wheel-date::after {
  content: ''; position: absolute; left: 0; right: 0; height: 34px; pointer-events: none; z-index: 3;
}
.wheel-date::before { top: 0; background: linear-gradient(180deg, rgba(250,245,236,0.95), rgba(250,245,236,0)); }
.wheel-date::after { bottom: 0; background: linear-gradient(0deg, rgba(250,245,236,0.95), rgba(250,245,236,0)); }
.intro-btn {
  position: relative;
  width: 100%; margin-top: 18px;
  padding: 14px;
  background: transparent;
  color: #6a5a3f;
  border: 1px solid rgba(184, 152, 92, 0.7);
  border-radius: 999px;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.35em;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, color 0.2s;
  text-indent: 0.35em;
  box-shadow:
    0 0 12px rgba(216, 184, 130, 0.25),
    0 0 24px rgba(216, 184, 130, 0.15);
}
.intro-btn:hover {
  color: #4a3a2f;
  box-shadow:
    0 0 16px rgba(255, 240, 200, 0.5),
    0 0 32px rgba(216, 184, 130, 0.3);
  transform: translateY(-1px);
}
.intro-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184,152,92,0.4); }
.intro-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.intro-note {
  font-size: 10px; color: #a08660; letter-spacing: 0.1em;
  margin-top: 14px; line-height: 1.6;
}

/* 質問画面 */
#quiz { display: none; }
.quiz-header { text-align: center; padding: 40px 0 24px; }
.quiz-brand { font-family: 'Zen Old Mincho', serif; font-size: 32px; letter-spacing: 0.5em; color: #4a3a6a; font-weight: 400; padding-left: 0.5em; margin-bottom: 12px; }
.quiz-tagline { font-family: 'Zen Old Mincho', serif; font-size: 13px; letter-spacing: 0.3em; color: #6a5a8a; padding-left: 0.3em; }
.quiz-divider { color: #b8985c; font-size: 14px; margin-top: 20px; opacity: 0.7; }
.progress-sticky { position: sticky; top: 0; background: rgba(244,238,246,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 14px 0 12px; margin-bottom: 16px; z-index: 50; }
.progress-label { font-family: 'Zen Old Mincho', serif; color: #b8985c; letter-spacing: 0.25em; }
.progress-text { text-align: center; color: #6a5a8a; font-size: 14px; margin-bottom: 10px; letter-spacing: 0.3em; font-family: 'Zen Old Mincho', serif; }
.progress-label { color: #c4a878; font-weight: 500; text-shadow: 0 0 8px rgba(216,201,168,0.4); }
.progress { background: rgba(168,124,207,0.15); border-radius: 6px; height: 6px; overflow: hidden; max-width: 360px; margin: 0 auto; box-shadow: inset 0 1px 2px rgba(0,0,0,0.08); }
.progress-bar { height: 100%; background: linear-gradient(90deg, #a87ccf, #d8c9a8, #e8d8b8); transition: width 0.6s cubic-bezier(.2,.7,.2,1); border-radius: 6px; box-shadow: 0 0 12px rgba(216,201,168,0.6), 0 0 4px rgba(168,124,207,0.4); }
@keyframes progressShimmer { 0% { background-position: 200% 0; } 100% { background-position: 0% 0; } }
.progress-bar { position: relative; overflow: hidden; }
.progress-bar::before { content:''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,245,210,0.4), rgba(255,235,180,0.95), rgba(255,245,210,0.4), transparent); background-size: 200% 100%; opacity: 0; border-radius: 6px; pointer-events: none; }
.progress-bar.kirari::before { animation: champagneFlow 1.0s ease-out; }
@keyframes champagneFlow {
  0% { opacity: 0; background-position: -50% 0; }
  30% { opacity: 1; }
  70% { opacity: 1; background-position: 150% 0; }
  100% { opacity: 0; background-position: 150% 0; }
}
.progress-bar::after { content:''; position: absolute; top: 50%; right: -6px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff, rgba(255,235,180,0.9) 30%, transparent 70%); transform: translateY(-50%); opacity: 0; pointer-events: none; box-shadow: 0 0 30px 10px rgba(255,235,180,0.8), 0 0 60px 20px rgba(196,168,120,0.5); }
.progress-bar.kirari::after { animation: progressTipFlash 0.9s ease-out; }
@keyframes progressTipFlash {
  0% { opacity: 0; transform: translateY(-50%) scale(0.3); box-shadow: 0 0 0 0 rgba(255,235,180,1), 0 0 0 0 rgba(196,168,120,0.8); }
  30% { opacity: 1; transform: translateY(-50%) scale(2); box-shadow: 0 0 40px 16px rgba(255,235,180,1), 0 0 80px 30px rgba(255,215,140,0.7); }
  60% { opacity: 0.8; transform: translateY(-50%) scale(3); box-shadow: 0 0 80px 28px rgba(255,235,180,0.6), 0 0 140px 50px rgba(196,168,120,0.4); }
  100% { opacity: 0; transform: translateY(-50%) scale(4.5); box-shadow: 0 0 160px 60px rgba(255,235,180,0), 0 0 220px 80px rgba(196,168,120,0); }
}

.question-card {

.option.c3 { border-color: #c4a0d4; }

.option.c4 { border-color: #ccc; }

.option.c5 { border-color: #a0d4a0; }

.option.c6 { border-color: #6abf6a; }

.option.c7 { border-color: #2ecc71; }

.submit-area { text-align: center; margin: 32px 0; }

.submit-remaining { color: #8a7aa0; font-size: 12px; margin-top: 12px; letter-spacing: 0.15em; font-family: 'Zen Old Mincho', serif; }

.result-type { font-size: 14px; color: #999; margin-bottom: 8px; }
.result-name { font-size: 56px; font-weight: bold; margin-bottom: 8px; background: linear-gradient(135deg, #7c5cbf, #a87ccf, #7c5cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 8px; }
.result-shadow .result-name { background: linear-gradient(135deg, #c0392b, #e74c3c, #c0392b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.result-mbti { font-size: 18px; color: #888; margin-bottom: 4px; letter-spacing: 4px; }
.result-identity { font-size: 14px; color: #7c5cbf; margin-bottom: 32px; }
.result-shadow .result-identity { color: #c0392b; }
.result-desc { color: #666; font-size: 14px; margin-bottom: 40px; line-height: 1.8; }

.scores { text-align: left; background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

.score-bar-fill.a { background: #a8e063; }
.score-bar-fill.c { background: #778beb; }

.radar-wrap { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 420px; margin-left: auto; margin-right: auto; }

.retry { margin-top: 20px; }
.retry button { background: #fff; border: 1px solid #ccc; color: #555; padding: 12px 32px; border-radius: 8px; cursor: pointer; font-size: 15px; }

/* ============================================
   召喚演出（儀式型ガチャ・油彩派手）
============================================ */
#ceremonyOverlay {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(ellipse at center, #1a0b1f 0%, #050207 70%);
  display: none;
  overflow: hidden;
  font-family: 'Zen Old Mincho', serif;
  color: #f3e2a8;
}
#ceremonyOverlay.active { display: block; }

/* 光柱 */
.cer-pillar {
  position: absolute;
  top: -10%; left: 50%; transform: translateX(-50%);
  width: 380px; height: 130%;
  background: linear-gradient(180deg,
    rgba(255, 240, 180, 0) 0%,
    rgba(255, 240, 180, 0.05) 20%,
    rgba(255, 220, 130, 0.18) 50%,
    rgba(255, 240, 180, 0.05) 80%,
    rgba(255, 240, 180, 0) 100%);
  filter: blur(8px);
  opacity: 0;
  animation: cerPillarFade 1.6s ease-out forwards;
  pointer-events: none;
}
@keyframes cerPillarFade {
  0% { opacity: 0; transform: translateX(-50%) scaleY(0.3); }
  60% { opacity: 1; transform: translateX(-50%) scaleY(1); }
  100% { opacity: 0.8; transform: translateX(-50%) scaleY(1); }
}
.cer-pillar.wide {
  width: 70vw;
  background: linear-gradient(180deg,
    rgba(255, 240, 180, 0) 0%,
    rgba(255, 220, 130, 0.08) 50%,
    rgba(255, 240, 180, 0) 100%);
  filter: blur(40px);
  animation: cerPillarFade 2.2s ease-out forwards;
}

/* 金箔粒子 */
.cer-dust {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.cer-dust span {
  position: absolute;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff5d0 0%, rgba(243, 226, 168, 0.6) 50%, transparent 100%);
  box-shadow: 0 0 6px #fff5d0;
  opacity: 0;
  animation: cerDustFloat linear infinite;
}
@keyframes cerDustFloat {
  0% { transform: translateY(110vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) translateX(var(--drift, 0px)); opacity: 0; }
}

/* 羊皮紙の文字 */
.cer-text {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  text-align: center;
  letter-spacing: 0.3em;
  text-shadow: 0 0 16px rgba(255, 220, 130, 0.7), 0 2px 8px rgba(0,0,0,0.8);
}
.cer-text.heading {
  top: 14%;
  font-size: 18px;
  color: #e8d4a0;
  opacity: 0;
  animation: cerTextFadeIn 1.2s ease-out 0.3s forwards;
}
.cer-text.subline {
  top: 22%;
  font-size: 14px;
  color: #c9a96a;
  letter-spacing: 0.4em;
  opacity: 0;
  animation: cerTextFadeIn 1.2s ease-out 0.8s forwards;
}
@keyframes cerTextFadeIn {
  0% { opacity: 0; letter-spacing: 0.6em; filter: blur(6px); }
  100% { opacity: 1; letter-spacing: 0.3em; filter: blur(0); }
}

/* ヒーロー画像召喚（左のイラスト部分のみ表示） */
.cer-hero-wrap {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  width: min(360px, 70vw);
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  opacity: 0;
  border: 2px solid transparent;
  background:
    linear-gradient(#1a0b1f, #1a0b1f) padding-box,
    linear-gradient(135deg, #b89cd8 0%, #f3e2a8 50%, #b89cd8 100%) border-box;
  box-shadow:
    0 0 40px rgba(255, 220, 130, 0.5),
    0 0 100px rgba(255, 200, 100, 0.3),
    inset 0 0 30px rgba(255, 240, 180, 0.2);
}
.cer-hero-wrap img {
  object-position: left center !important;
}
.cer-hero-wrap.show {
  animation: cerHeroEmerge 2.2s cubic-bezier(.3,.7,.4,1) forwards;
}
@keyframes cerHeroEmerge {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); filter: blur(20px); }
  30% { opacity: 0.7; filter: blur(8px); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
}
.cer-hero-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}

/* 結果テキスト */
.cer-reveal {
  position: absolute;
  left: 50%; bottom: 14%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0;
  pointer-events: none;
}
.cer-reveal.show {
  animation: cerRevealIn 1.4s ease-out forwards;
}
@keyframes cerRevealIn {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.cer-reveal-lead {
  font-size: 14px; letter-spacing: 0.3em;
  color: #c9a96a; margin-bottom: 12px;
}
.cer-reveal-name {
  font-size: 42px; font-weight: 500;
  letter-spacing: 0.25em;
  color: #fff5d0;
  text-shadow:
    0 0 24px rgba(255, 220, 130, 0.9),
    0 0 60px rgba(255, 200, 100, 0.5);
}
.cer-reveal-fr {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: #b8985c;
}

/* 金ヴェールフラッシュ */
.cer-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(255, 240, 180, 0.9) 0%, rgba(255, 220, 130, 0.4) 40%, transparent 80%);
  opacity: 0;
  pointer-events: none;
}
.cer-flash.fire { animation: cerFlashFire 0.8s ease-out; }
@keyframes cerFlashFire {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0; }
}

/* タップで進む */
.cer-tap {
  position: absolute;
  left: 50%; bottom: 5%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.4em;
  color: rgba(243, 226, 168, 0.5);
  opacity: 0;
  animation: cerTapBlink 1.8s ease-in-out 3s infinite;
}
@keyframes cerTapBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

/* ============================================
   タイブレーカー（境界の人だけ・追加問）
============================================ */
#tiebreakerOverlay {
  position: fixed; inset: 0; z-index: 9998;
  background: radial-gradient(ellipse at center, #fbf5fb 0%, #eadcef 60%, #d8c5e6 100%);
  display: none;
  overflow: hidden;
  font-family: 'Zen Old Mincho', serif;
  color: #4a3a6a;
}
#tiebreakerOverlay.active { display: block; }

.tb-stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6vh 6vw;
  text-align: center;
}

.tb-eyebrow {
  font-size: 15px; letter-spacing: 0.6em;
  color: #b8985c;
  margin-bottom: 22px;
  opacity: 0;
  animation: tbFadeIn 0.9s ease-out 0.2s forwards;
}
.tb-axis-name {
  font-size: 44px; letter-spacing: 0.4em;
  color: #5a4880;
  margin-bottom: 8px;
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.9), 0 0 48px rgba(216, 184, 224, 0.7);
  opacity: 0;
  animation: tbAxisIn 1.2s cubic-bezier(.3,.7,.4,1) 0.6s forwards;
}
.tb-axis-sub {
  font-size: 16px; letter-spacing: 0.5em;
  color: #8a6fb0;
  margin-bottom: 40px;
  opacity: 0;
  animation: tbFadeIn 0.9s ease-out 1.4s forwards;
}
.tb-question {
  font-size: 17px; line-height: 2;
  color: #3a2a55;
  max-width: 640px;
  margin-bottom: 36px;
  letter-spacing: 0.05em;
  opacity: 0;
  animation: tbFadeIn 1.2s ease-out 2s forwards;
  text-wrap: pretty;
}
.tb-prompt {
  font-size: 14px; letter-spacing: 0.4em;
  color: #b8985c;
  margin-bottom: 24px;
  opacity: 0;
  animation: tbFadeIn 0.9s ease-out 2.6s forwards;
}
.tb-choices {
  display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
}
.tb-choice {
  position: relative;
  min-width: 240px;
  max-width: 340px;
  padding: 26px 28px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(245, 235, 250, 0.55) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(184, 152, 92, 0.45);
  border-radius: 10px;
  color: #3a2a55;
  font-family: inherit;
  font-size: 16px; line-height: 1.7;
  letter-spacing: 0.08em;
  cursor: pointer;
  opacity: 0;
  transition: all 0.3s;
  text-align: center;
}
.tb-choice .tb-mark {
  display: block;
  font-size: 28px;
  color: #b8985c;
  margin-bottom: 14px;
  letter-spacing: 0;
  text-shadow: 0 0 12px rgba(255, 240, 200, 0.7);
}
.tb-choice.left { animation: tbChoiceLeft 0.9s cubic-bezier(.3,.7,.4,1) 3s forwards; }
.tb-choice.right { animation: tbChoiceRight 0.9s cubic-bezier(.3,.7,.4,1) 3s forwards; }
.tb-choice:hover {
  border-color: rgba(216, 184, 130, 0.95);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(250, 240, 235, 0.85) 100%);
  box-shadow:
    0 0 24px rgba(255, 240, 200, 0.7),
    0 0 48px rgba(216, 184, 224, 0.4),
    inset 0 0 20px rgba(255, 250, 235, 0.5);
  transform: translateY(-4px);
}
.tb-choice.chosen {
  animation: tbChosenFlash 0.6s ease-out;
}
@keyframes tbAxisIn {
  0% { opacity: 0; transform: scale(2.2); letter-spacing: 1em; filter: blur(20px); }
  40% { opacity: 1; transform: scale(1.15); filter: blur(2px); }
  70% { transform: scale(0.95); filter: blur(0); }
  100% { opacity: 1; transform: scale(1); letter-spacing: 0.4em; filter: blur(0); text-shadow: 0 0 40px rgba(255, 220, 130, 1), 0 0 80px rgba(200, 150, 255, 0.6); }
}
@keyframes tbFadeIn {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes tbChoiceLeft {
  0% { opacity: 0; transform: translateX(-80px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes tbChoiceRight {
  0% { opacity: 0; transform: translateX(80px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes tbChosenFlash {
  0% { background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(245, 235, 250, 0.55) 100%); }
  50% {
    background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(255, 245, 220, 0.95) 100%);
    box-shadow: 0 0 60px rgba(255, 240, 200, 1), 0 0 120px rgba(216, 184, 224, 0.7);
    color: #5a4880;
  }
  100% { opacity: 0; transform: scale(0.95); }
}

/* タイブレーカー稲妻背景 */
.tb-lightning {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(160, 100, 200, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(120, 80, 180, 0.12) 0%, transparent 50%);
  pointer-events: none;
  animation: tbLightning 6s ease-in-out infinite;
}
@keyframes tbLightning {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.8; }
}

/* 入場閃光フラッシュ */
.tb-entry-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, #fff 0%, rgba(200, 150, 255, 0.6) 30%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  animation: tbEntryFlash 0.6s ease-out forwards;
}
@keyframes tbEntryFlash {
  0% { opacity: 0; }
  20% { opacity: 1; }
  100% { opacity: 0; }
}

/* 稲妻パルス（入場時のみ・走り終わって静止） */
.tb-bolt {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 240, 200, 0.5) 42%, rgba(255, 255, 255, 0.85) 50%, rgba(255, 240, 200, 0.5) 58%, transparent 100%);
  opacity: 0;
  pointer-events: none;
  animation: tbBoltStrike 1.5s ease-out forwards;
  mix-blend-mode: normal;
  filter: drop-shadow(0 0 14px rgba(255, 220, 150, 0.5));
}
.tb-bolt.b2 { animation-delay: 0.7s; }
@keyframes tbBoltStrike {
  0% { opacity: 0; }
  15% { opacity: 0.85; }
  35% { opacity: 0; }
  50% { opacity: 0.5; }
  65% { opacity: 0; }
  100% { opacity: 0; }
}

/* 軸対立粒子（左右から中央へ衝突） */
.tb-particles {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.tb-particles span {
  position: absolute;
  bottom: -10px;
  width: var(--sz, 3px); height: var(--sz, 3px);
  border-radius: 50%;
  background: radial-gradient(circle, var(--pc, #e8c4ff) 0%, rgba(255,255,255,0.2) 60%, transparent 100%);
  box-shadow: 0 0 8px var(--pc, #c89cff);
  animation: tbParticleCollide linear infinite;
  --tx: 0px;
}
@keyframes tbParticleCollide {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  8% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateY(-110vh) translateX(var(--tx, 0px)); opacity: 0; }
}

/* カメラシェイク */
.tb-stage.shake {
  animation: tbShake 0.5s ease-out;
}

  const yEl = document.getElementById("inYear");
  const mEl = document.getElementById("inMonth");
  const dEl = document.getElementById("inDay");
  if (!yEl) return;
  const ITEM_H = 34;
  const nowY = new Date().getFullYear();

  // ホイール生成：valuesの配列でアイテムを並べ、隠しinputに選択値を反映
  function makeWheel(wheelEl, values, hiddenEl, onSettle) {
    wheelEl.innerHTML = "";
    const padTop = document.createElement("div"); padTop.className = "wheel-pad"; wheelEl.appendChild(padTop);
    values.forEach(v => {
      const it = document.createElement("div");
      it.className = "wheel-item";
      it.textContent = v;
      it.dataset.value = v;
      it.addEventListener("click", () => scrollToIndex(values.indexOf(v), true));
      wheelEl.appendChild(it);
    });
    const padBot = document.createElement("div"); padBot.className = "wheel-pad"; wheelEl.appendChild(padBot);

    const items = wheelEl.querySelectorAll(".wheel-item");
    function highlight(idx) {
      items.forEach((it, i) => it.classList.toggle("center", i === idx));
    }
    function currentIndex() {
      return Math.max(0, Math.min(values.length - 1, Math.round(wheelEl.scrollTop / ITEM_H)));
    }
    function settle() {
      const idx = currentIndex();
      highlight(idx);
      hiddenEl.value = values[idx];
      if (onSettle) onSettle(values[idx]);
    }
    function scrollToIndex(idx, smooth) {
      wheelEl.scrollTo({ top: idx * ITEM_H, behavior: smooth ? "smooth" : "auto" });
      highlight(idx);
      hiddenEl.value = values[idx];
    }
    let scrollTimer;
    wheelEl.addEventListener("scroll", () => {
      highlight(currentIndex());
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(settle, 120);
    });
    wheelEl._scrollToValue = (v) => {
      const idx = values.indexOf(v);
      if (idx >= 0) scrollToIndex(idx, false);
    };
    wheelEl._settle = settle;
    return { values };
  }

  const years = []; for (let y = nowY; y >= 1920; y--) years.push(y);
  const months = []; for (let m = 1; m <= 12; m++) months.push(m);
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function buildDays(y, m) {
    const max = (y && m) ? daysInMonth(y, m) : 31;
    const arr = []; for (let d = 1; d <= max; d++) arr.push(d); return arr;
  }

  const btn = document.getElementById("introSubmitBtn");
  const nameInput = document.getElementById("inNickname");
  function check() {
    const hasName = nameInput.value.trim();
    const hasBday = yEl.value && mEl.value && dEl.value;
    const hasGender = document.querySelector('input[name="inGender"]:checked');
    btn.disabled = !(hasName && hasBday && hasGender);
  }

  const wY = document.getElementById("wheelYear");
  const wM = document.getElementById("wheelMonth");
  const wD = document.getElementById("wheelDay");

  function rebuildDays() {
    const y = +yEl.value, m = +mEl.value;
    const prevD = +dEl.value || 1;
    makeWheel(wD, buildDays(y, m), dEl, check);
    const days = buildDays(y, m);
    const target = Math.min(prevD, days.length);
    wD._scrollToValue(target);
    wD._settle();
  }

  makeWheel(wY, years, yEl, () => { rebuildDays(); check(); });
  makeWheel(wM, months, mEl, () => { rebuildDays(); check(); });
  makeWheel(wD, buildDays(), dEl, check);

  // 前回入力 or デフォルト（1990/1/1）に初期化
  const savedName = localStorage.getItem("nanimono_nickname");
  const savedBday = localStorage.getItem("nanimono_birthday");
  const savedGender = localStorage.getItem("nanimono_gender");
  if (savedName) nameInput.value = savedName;
  let initY = 1990, initM = 1, initD = 1;
  if (savedBday) {
    const mm = savedBday.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (mm) { initY = +mm[1]; initM = +mm[2]; initD = +mm[3]; }
  }
  if (savedGender) {
    const radio = document.querySelector(`input[name="inGender"][value="${savedGender}"]`);
    if (radio) radio.checked = true;
  }
  // モーダルが開いた時にスクロール位置を合わせる必要があるので関数化
  window.__initWheelPositions = function() {
    wY._scrollToValue(initY); wY._settle();
    wM._scrollToValue(initM); wM._settle();
    makeWheel(wD, buildDays(initY, initM), dEl, check);
    wD._scrollToValue(initD); wD._settle();
  };

  nameInput.addEventListener("input", check);
  document.querySelectorAll('input[name="inGender"]').forEach(r => r.addEventListener("change", check));
  check();
})();

function sendLog(typeId, scores) {
  if (!GAS_LOG_URL) return;
  const duration = quizStartTime ? Math.round((Date.now() - quizStartTime) / 1000) : 0;
  const changes = answerChanges.reduce((a, b) => a + b, 0);
  // 日本語名を組み立てる：賢者（INTJ-A）形式
  const _mbti = (typeId || "").split("-")[0];
  const _suffix = (typeId || "").split("-")[1];
  const _jaName = (typeMap[_mbti] && typeMap[_mbti][_suffix === "A" ? "light" : "shadow"]) || "";
  const typeLabel = _jaName ? `${_jaName}（${typeId}）` : typeId;
  const payload = {
    nickname: userNickname || localStorage.getItem("nanimono_nickname") || "",
    birthday: userBirthday || localStorage.getItem("nanimono_birthday") || "",
    type: typeLabel,
    ref: getRef(),
    src: getSrc(),
    duration: duration,
    device: getDevice(),
    changes: changes,
    timezone: getTimezone(),
    gender: userGender || localStorage.getItem("nanimono_gender") || "",
    answers: answers.slice(),
    lazyFlag: window.__nanimonoLazyFlag || null,
    hellProceeded: !!window.__nanimonoHellProceeded
  };
  // ページ遷移しても確実に届くよう sendBeacon を優先利用
  const body = JSON.stringify(payload);
  try {
    if (navigator.sendBeacon) {
      const blob = new Blob([body], { type: "text/plain;charset=utf-8" });
      const ok = navigator.sendBeacon(GAS_LOG_URL, blob);
      console.log("[ナニモノログ] sendBeacon:", ok);
    } else {
      fetch(GAS_LOG_URL, {
        method: "POST",
        mode: "no-cors",
        keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: body
      }).catch(e => console.warn("log send failed", e));
    }
  } catch(e) { console.warn("log send error", e); }
}

function calcScores() {
  const axes = { E:[], O:[], A:[], C:[], N:[] };
  questions.forEach((q, i) => {
    let val = answers[i];
    if (q.rev) val = 7 - val;  // 6段階: 1↔6, 2↔5, 3↔4
    axes[q.axis].push(val);
  });
  const scores = {};
  for (const [k, vals] of Object.entries(axes)) {
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    scores[k] = { avg, pct: Math.round(((avg - 1) / 5) * 100) };
  }
  return scores;
}

function getType(scores) {
  let mbti = "";
  mbti += scores.E.avg >= 3.5 ? "E" : "I";  // 6段階の中央=3.5
  mbti += scores.O.avg >= 3.5 ? "N" : "S";
  mbti += scores.A.avg >= 3.5 ? "F" : "T";
  mbti += scores.C.avg >= 3.5 ? "J" : "P";
  const identity = scores.N.avg < 3.5 ? "light" : "shadow";
  return { mbti, identity };
}

// 境界判定：avgが3.5±0.2のレンジにある軸を検出
function detectBoundaries(scores) {
  const TH = 0.2;
  const axes = ["E", "O", "A", "C", "N"];
  return axes.filter(ax => Math.abs(scores[ax].avg - 3.5) <= TH);
}

// 境界の軸を逆転させた「もう一つの型」を計算
function getAltType(mbti, identity, axes) {
  const flipMap = { E:[0, "E","I"], O:[1, "N","S"], A:[2, "F","T"], C:[3, "J","P"] };
  let altMbti = mbti.split("");
  let altIdentity = identity;
  for (const ax of axes) {
    if (ax === "N") {
      altIdentity = identity === "light" ? "shadow" : "light";
    } else {
      const [pos, hi, lo] = flipMap[ax];
      altMbti[pos] = altMbti[pos] === hi ? lo : hi;
    }
  }
  return { mbti: altMbti.join(""), identity: altIdentity };
}

async function showResult() {
  if (answers.some(a => a === null)) return;

  // いたずら回答検出（fill/replayはバイパス）
  if (!window.__nanimonoBypassGuard) {
    const allSame = answers.every(a => a === answers[0]);
    const totalSec = quizStartTime ? (Date.now() - quizStartTime) / 1000 : 999;
    const tooFast = totalSec < Math.max(15, answers.length * 0.6); // 1問0.6秒未満 or 全体15秒未満
    if (allSame || tooFast) {
      window.__nanimonoLazyFlag = allSame ? "allSame" : "tooFast";
      const reason = allSame
        ? "<em>全ての問いに同じ印を遺した</em>者よ。<br>その魂は、揺らがぬほどに乾いているのか。"
        : `<em>${Math.round(totalSec)}秒で40問</em>を駆け抜けた者よ。<br>その早さは、覚悟か、それとも逃避か。`;
      document.getElementById("hellBody").innerHTML = reason;
      // 火の粉生成
      const sparks = document.getElementById("hellSparks");
      sparks.innerHTML = "";
      const sparkCount = window.matchMedia('(max-width: 640px)').matches ? 18 : 36;
      let sh = "";
      for (let i = 0; i < sparkCount; i++) {
        const left = Math.random() * 100;
        const sz = 2 + Math.random() * 4;
        const dur = 4 + Math.random() * 5;
        const delay = Math.random() * 5;
        const tx = (Math.random() - 0.5) * 80;
        sh += `<span style="left:${left}%;--sz:${sz}px;--tx:${tx}px;animation-duration:${dur}s;animation-delay:${delay}s;"></span>`;
      }
      sparks.innerHTML = sh;
      document.getElementById("hellGate").classList.add("active");
      return; // ボタン操作待ち
    }
  }

  let scores = calcScores();

  // 境界の人判定：揺らぎ軸を検出してタイブレーカーへ
  const boundaryAxes = detectBoundaries(scores);
  let wasBoundary = boundaryAxes.length > 0;
  let tiebreakerChoices = [];
  if (wasBoundary) {
    const tbResult = await showTiebreaker(boundaryAxes, scores);
    scores = tbResult.scores;
    tiebreakerChoices = tbResult.choices;
  }

  // タイブレーカー後のスコアで再判定
  const { mbti, identity } = recomputeType(scores);
  const variant = identity === "light" ? "A" : "T";
  const typeId = `${mbti}-${variant}`;

  // === デバッグログ ===
  console.log("===== ナニモノ診断スコア =====");
  console.log(`判定: ${mbti}-${variant} (${identity})`);
  console.log(`揺らぎ突破: ${wasBoundary ? boundaryAxes.join(",") : "なし"}`);
  console.table({
    E: { avg: scores.E.avg.toFixed(2), pct: scores.E.pct + "%", 判定: scores.E.avg >= 3.5 ? "E(外向)" : "I(内向)" },
    O: { avg: scores.O.avg.toFixed(2), pct: scores.O.pct + "%", 判定: scores.O.avg >= 3.5 ? "N(直感)" : "S(現実)" },
    A: { avg: scores.A.avg.toFixed(2), pct: scores.A.pct + "%", 判定: scores.A.avg >= 3.5 ? "F(感情)" : "T(論理)" },
    C: { avg: scores.C.avg.toFixed(2), pct: scores.C.pct + "%", 判定: scores.C.avg >= 3.5 ? "J(計画)" : "P(柔軟)" },
    N: { avg: scores.N.avg.toFixed(2), pct: scores.N.pct + "%", 判定: scores.N.avg < 3.5 ? "light(光)" : "shadow(影)" }
  });
  console.log("全回答:", answers.join(","));
  console.log("===========================");

  localStorage.setItem("nanimono_last", JSON.stringify({ typeId, date: new Date().toLocaleDateString("ja-JP") }));
  localStorage.setItem("nanimono_myType", typeId);
  localStorage.setItem("nanimono_lastScores", JSON.stringify(scores));
  localStorage.setItem("nanimono_lastAnswers", JSON.stringify(answers));

  // 揺らぎ突破バッジ用：境界の人だったかの記録（揺らぎ前の代替型も全て記録）
  if (wasBoundary) {
    // 揺らぎ前のタイプを基準に、境界軸の2^N通りの組み合わせを全列挙
    const preScores = calcScores();
    const preType = recomputeType(preScores);
    const n = boundaryAxes.length;
    const altSet = new Set();
    for (let mask = 0; mask < (1 << n); mask++) {
      const flipAxes = boundaryAxes.filter((_, i) => (mask >> i) & 1);
      const alt = getAltType(preType.mbti, preType.identity, flipAxes);
      const altId = `${alt.mbti}-${alt.identity === "light" ? "A" : "T"}`;
      if (altId !== typeId) altSet.add(altId);
    }
    const possibleAlts = Array.from(altSet);
    localStorage.setItem("nanimono_boundary", JSON.stringify({
      primary: typeId,
      possibleAlt: possibleAlts[0] || null,  // 後方互換
      possibleAlts: possibleAlts,
      axes: boundaryAxes,
      tiebreakerChoices: tiebreakerChoices,
      passed: true
    }));
  } else {
    localStorage.removeItem("nanimono_boundary");
  }

  // GASへログ送信
  sendLog(typeId, scores);

  // 召喚演出
  const allTypes = await getAllTypes();
  await showCeremony(typeId, allTypes);

  // 結果ページへ
  location.href = `result.html?type=${typeId}`;
}

const AXIS_PARTICLE_COLORS = {

function showTiebreakerIntro(axes) {
  return new Promise(resolve => {
    const overlay = document.getElementById("tiebreakerOverlay");
    overlay.classList.add("active");
    const total = axes.length;
    overlay.innerHTML = `
      <div class="tb-lightning"></div>
      <div class="tb-bolt"></div>
      <div class="tb-bolt b2"></div>
      <div class="tb-entry-flash"></div>
      <div class="tb-stage">
        <div class="tb-eyebrow">— 揺らぎ判定 —</div>
        <div class="tb-axis-name">${total}つの境</div>
        <div class="tb-axis-sub">あなたの中で揺れている</div>
        <div class="tb-question">境を ${total} つ抱えるあなたは、稀な存在。<br>順にひとつずつ、自分を確定していく──</div>
      </div>
    `;
    // 3秒で次へ
    setTimeout(resolve, 3200);
  });
}

async function showTiebreaker(axes, scores) {
  // 複数軸ならイントロ表示
  if (axes.length >= 2) {
    await showTiebreakerIntro(axes);
  }
  return new Promise(resolve => {
    const overlay = document.getElementById("tiebreakerOverlay");
    overlay.classList.add("active");
    let idx = 0;
    const total = axes.length;
    const choicesRecord = [];
    function nextAxis() {
      if (idx >= axes.length) {
        overlay.classList.remove("active");
        overlay.innerHTML = "";
        resolve({ scores, choices: choicesRecord });
        return;
      }
      const ax = axes[idx];
      const q = TIEBREAKER_QUESTIONS[ax];
      // 軸対立粒子：左右から中央へ衝突
      const cols = AXIS_PARTICLE_COLORS[ax] || { left: '#c89cff', right: '#c89cff' };
      let particlesHtml = '<div class="tb-particles">';
      const particleCount = window.matchMedia('(max-width: 640px)').matches ? 8 : 16;
      for (let i = 0; i < particleCount; i++) {
        // 左側：画面左20%以内から発生、中央へ向かって右にドリフト
        const lLeft = Math.random() * 30;
        const lDur = 7 + Math.random() * 6;
        const lDelay = Math.random() * 7;
        const lDriftX = (40 + Math.random() * 30); // vw単位で中央方向へ
        const lSize = 2 + Math.random() * 3;
        particlesHtml += `<span style="left:${lLeft}%;--sz:${lSize}px;--pc:${cols.left};--tx:${lDriftX}vw;animation-duration:${lDur}s;animation-delay:${lDelay}s;"></span>`;
        // 右側：画面右20%以内から発生、中央へ向かって左にドリフト
        const rLeft = 70 + Math.random() * 30;
        const rDur = 7 + Math.random() * 6;
        const rDelay = Math.random() * 7;
        const rDriftX = -(40 + Math.random() * 30);
        const rSize = 2 + Math.random() * 3;
        particlesHtml += `<span style="left:${rLeft}%;--sz:${rSize}px;--pc:${cols.right};--tx:${rDriftX}vw;animation-duration:${rDur}s;animation-delay:${rDelay}s;"></span>`;
      }
      particlesHtml += '</div>';

      const progressLabel = total > 1 ? `— 揺らぎ判定 ${idx+1} / ${total} —` : `— 揺らぎ判定 —`;
      overlay.innerHTML = `
        <div class="tb-lightning"></div>
        ${particlesHtml}
        <div class="tb-bolt"></div>
        <div class="tb-bolt b2"></div>
        <div class="tb-entry-flash"></div>
        <div class="tb-stage">
          <div class="tb-eyebrow">${progressLabel}</div>
          <div class="tb-axis-name">${q.name}</div>
          <div class="tb-axis-sub">${q.sub}</div>
          <div class="tb-question">${q.text}</div>
          <div class="tb-prompt">さぁ──あなたならどっち？</div>
          <div class="tb-choices">
            <button type="button" class="tb-choice left" data-choice="A">
              <span class="tb-mark">🅐</span>${q.A.label}
            </button>
            <button type="button" class="tb-choice right" data-choice="B">
              <span class="tb-mark">🅑</span>${q.B.label}
            </button>
          </div>
        </div>
      `;

      // 軸名出現タイミングでカメラシェイク
      const stage = overlay.querySelector(".tb-stage");
      setTimeout(() => {
        if (stage) {
          stage.classList.add("shake");
          setTimeout(() => stage.classList.remove("shake"), 600);
        }
      }, 700);
      overlay.querySelectorAll(".tb-choice").forEach(btn => {
        btn.addEventListener("click", () => {
          if (btn.classList.contains("chosen")) return;
          const choice = btn.dataset.choice;
          const side = q[choice].side;
          // スコア確定：lowなら2、highなら5に上書き（中央3.5を超えて確実に確定）
          scores[ax].avg = side === "low" ? 2.0 : 5.0;
          scores[ax].pct = side === "low" ? 25 : 80;
          choicesRecord.push({
            axis: ax,
            name: q.name,
            chosenLabel: q[choice].label,
            sideChosen: side,
            otherLabel: q[choice === "A" ? "B" : "A"].label
          });
          btn.classList.add("chosen");
          setTimeout(() => {
            idx++;
            nextAxis();
          }, 700);
        });
      });
    }
    nextAxis();
  });
}

// 召喚演出（全員向け・儀式型）
function showCeremony(typeId, allTypes) {
  return new Promise(resolve => {
    const overlay = document.getElementById("ceremonyOverlay");
    const data = allTypes ? allTypes.find(t => t.id === typeId) : null;
    const name = data ? data.name : "";
    const fr = data ? (data.furigana || "") : "";
    const heroSrc = `挿絵/${name}/${name}_${typeId}_hero.webp`;

    // 金箔粒子を動的生成
    let dustHtml = '<div class="cer-dust">';
    for (let i = 0; i < 40; i++) {
      const left = Math.random() * 100;
      const dur = 8 + Math.random() * 10;
      const delay = Math.random() * 8;
      const drift = (Math.random() - 0.5) * 200;
      const size = 2 + Math.random() * 3;
      dustHtml += `<span style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--drift:${drift}px;"></span>`;
    }
    dustHtml += '</div>';

    overlay.classList.add("active");
    overlay.innerHTML = `
      <div class="cer-pillar wide"></div>
      <div class="cer-pillar"></div>
      ${dustHtml}
      <div class="cer-text heading">あなたが何者かを開示する</div>
      <div class="cer-text subline">— 静かに、深く、その姿が映し出される —</div>
    `;

    // 1.6sでヒーロー画像召喚
    setTimeout(() => {
      const heroEl = document.createElement("div");
      heroEl.className = "cer-hero-wrap show";
      heroEl.innerHTML = `<img src="${heroSrc}" alt="${name}" onerror="this.style.display='none'">`;
      overlay.appendChild(heroEl);
    }, 1800);

    // 3.8sで金フラッシュ
    setTimeout(() => {
      const flash = document.createElement("div");
      flash.className = "cer-flash fire";
      overlay.appendChild(flash);
    }, 3800);

    // 4.2sで名前表示
    setTimeout(() => {
      // ヘッダー削除
      overlay.querySelectorAll(".cer-text").forEach(el => el.style.opacity = "0");
      const reveal = document.createElement("div");
      reveal.className = "cer-reveal show";
      reveal.innerHTML = `
        <div class="cer-reveal-lead">✦ あなたは ✦</div>
        <div class="cer-reveal-name">${name}</div>
        ${fr ? `<div class="cer-reveal-fr">${fr}</div>` : ""}
      `;
      overlay.appendChild(reveal);
      const tap = document.createElement("div");
      tap.className = "cer-tap";
      tap.textContent = "タップで進む";
      overlay.appendChild(tap);
    }, 4200);

    // タップ or 8秒経過で resolve
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      overlay.removeEventListener("click", finish);
      resolve();
    };
    setTimeout(() => {
      overlay.addEventListener("click", finish);
    }, 5500);
    setTimeout(finish, 12000);
  });
}

// allDataのキャッシュ
let _allTypesCache = null;
async function getAllTypes() {
  if (_allTypesCache) return _allTypesCache;
  try {
    const res = await fetch("nanimono_data.json");
    _allTypesCache = await res.json();
    return _allTypesCache;
  } catch (e) {
    console.warn("nanimono_data.json fetch failed", e);
    return null;
  }
}

// MBTI判定をスコアから再計算
function recomputeType(scores) {
  let mbti = "";
  mbti += scores.E.avg >= 3.5 ? "E" : "I";
  mbti += scores.O.avg >= 3.5 ? "N" : "S";
  mbti += scores.A.avg >= 3.5 ? "F" : "T";
  mbti += scores.C.avg >= 3.5 ? "J" : "P";
  const identity = scores.N.avg < 3.5 ? "light" : "shadow";
  return { mbti, identity };
}
